name: Expense Tracker CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the latest code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 3. Copy project to EC2
      - name: Copy project to EC2
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".env" \
            --exclude "node_modules" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/Expense-Tracker/Desktop/expense tracking system/" \
            -e "ssh -i ~/.ssh/ec2_key"

      # 4. Rebuild and restart Docker containers
     - name: Deploy with Docker Compose
  run: |
    ssh \
      -i ~/.ssh/ec2_key \
      -o ServerAliveInterval=30 \
      -o ServerAliveCountMax=10 \
      "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
      'cd "/home/ubuntu/Expense-Tracker/Desktop/expense tracking system" && docker compose up -d --build'
