services:

  frontend:
    build:
      context: ./client
    container_name: expense-frontend-container
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - expense-network
      
  backend:
    build: .
    container_name: expense-backend-container
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - expense-network

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: expense_tracking_system
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - expense-network

networks:
  expense-network:

volumes:
  mysql_data: